services:
  - type: web
    name: bgulab
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: GITHUB_REPO
        value: nimrodtalmon/BGULAB
      - key: GITHUB_TOKEN
        sync: false
      - key: GOVERN_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
