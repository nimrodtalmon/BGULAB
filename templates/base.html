<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · BGULAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <input type="checkbox" id="menu" class="menu-toggle">
    <label for="menu" class="burger" aria-label="Menu"><span></span></label>
    <nav class="links">
      {% for href, label in nav %}<a href="{{ href }}"{% if request.url.path == href %} class="here"{% endif %}>{{ label }}</a>{% endfor %}
      {% if lab %}
        <form class="auth" method="post" action="/logout"><span class="who">{{ lab_name }}</span> <button class="link">sign out</button></form>
      {% else %}
        <a class="auth" href="/login?next={{ request.url.path }}">Sign in</a>
      {% endif %}
    </nav>
    <a class="govern{% if request.url.path == '/govern' %} here{% endif %}" href="/govern" id="govern-open">Govern</a>
  </div>
</header>
<dialog id="govern-pop" class="pop" aria-labelledby="govern-pop-title">
  <form method="post" action="/govern" class="govern-form">
    <h2 id="govern-pop-title">Govern</h2>
    <p class="muted">Any change to this site or its rules. From <code class="from"></code>. <a href="/govern">More</a></p>
    {% if not lab %}
      <label>Your name <input name="name" required maxlength="60" autocomplete="name"></label>
      <label>Lab password <input name="password" type="password" autocomplete="current-password"></label>
    {% endif %}
    <textarea name="text" required maxlength="3000" rows="4" aria-label="Request"
      placeholder="What should change?"></textarea>
    <input type="hidden" name="page">
    <div class="actions"><button type="submit">Send</button>
      <span class="muted hint">Enter sends · Shift+Enter for a new line</span>
      <button type="button" class="link" value="close">Close</button></div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<main>
{% block main %}{% endblock %}
</main>
<script>
var lastOpen = "";
// Open the collapsed sections that hold the linked-to part of the page.
function openTarget() {
  var el = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (el && el.tagName === "DIALOG") { openProject(el); return; }
  var target = el;
  for (; el; el = el.parentElement) if (el.tagName === "DETAILS") el.open = true;
  if (target) target.scrollIntoView();
}

// Research: each project opens in a popup; its address is the page + #project.
function openProject(d) {
  if (!d.showModal) { d.setAttribute("open", ""); return; }
  if (!d.open) d.showModal();
  lastOpen = "#" + d.id;
  history.replaceState(null, "", "#" + d.id);
}
document.querySelectorAll("[data-pop]").forEach(function (a) {
  a.addEventListener("click", function (e) {
    e.preventDefault();
    openProject(document.getElementById(a.dataset.pop));
  });
});
document.querySelectorAll("dialog.project-pop").forEach(function (d) {
  d.addEventListener("close", function () { history.replaceState(null, "", location.pathname); });
  d.addEventListener("click", function (e) { if (e.target === d) d.close(); });
  d.querySelector("[value=close]").addEventListener("click", function () { d.close(); });
  d.querySelector("[data-govern]").addEventListener("click", function () {
    d.close(); lastOpen = "#" + d.id;
    document.getElementById("govern-open").click();
  });
});

// Govern: where the reader is (page, and the section opened last).
document.addEventListener("toggle", function (e) {
  if (e.target.tagName === "DETAILS" && e.target.open && e.target.id) lastOpen = "#" + e.target.id;
}, true);
function here() { return location.pathname + (lastOpen || location.hash); }

// Every Govern form: one click sends once, and says where it was sent from.
document.querySelectorAll("main form.govern-form").forEach(function (f) {
  f.addEventListener("submit", function () {
    f.elements.page && (f.elements.page.value = here());
    f.querySelector("button[type=submit]").disabled = true;
  });
});

// The Govern button opens a popup; without JavaScript it is a plain link.
var pop = document.getElementById("govern-pop");
var toast = document.getElementById("toast"), toastTimer;
function say(html, error, keep) {
  clearTimeout(toastTimer);
  toast.innerHTML = html; toast.className = "show" + (error ? " error" : "");
  if (!keep) toastTimer = setTimeout(function () { toast.className = ""; }, 2500);
}
if (pop && pop.showModal) {
  var form = pop.querySelector("form");
  function openGovern(text) {
    pop.querySelector(".from").textContent = here();
    if (text) form.elements.text.value = text;
    pop.showModal();
    var first = form.querySelector("input[name=name]");
    (first && !first.value ? first : form.elements.text).focus();
  }
  document.getElementById("govern-open").addEventListener("click", function (e) {
    e.preventDefault(); openGovern();
  });
  pop.querySelector("[value=close]").addEventListener("click", function () { pop.close(); });
  pop.addEventListener("click", function (e) { if (e.target === pop) pop.close(); });
  // Enter sends; Shift+Enter is a new line.
  form.elements.text.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  // Send in the background: the popup closes at once, a short note confirms.
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    form.elements.page.value = here();
    var data = new FormData(form), text = form.elements.text.value;
    form.elements.text.value = "";
    pop.close();
    say("Sending…", false, true);
    fetch("/govern", {method: "POST", body: data, headers: {Accept: "application/json"}})
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r.ok) throw r.message;
        if (!r.counted) say("Password not recognized: recorded, but not counted.", true);
        else say("Sent ✓");
        if (r.counted) form.querySelectorAll("label").forEach(function (l) { l.remove(); });  // signed in now
      })
      .catch(function (msg) {
        say((typeof msg === "string" ? msg : "Could not send.") +
            ' <button type="button" class="link">Edit and resend</button>', true, true);
        toast.querySelector("button").onclick = function () { toast.className = ""; openGovern(text); };
      });
  });
}
window.addEventListener("hashchange", openTarget);
openTarget();
</script>
</body>
</html>
